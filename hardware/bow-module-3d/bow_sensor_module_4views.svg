<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#27313b"/></marker>
    <linearGradient id="shell" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#515b65"/><stop offset="1" stop-color="#242a30"/></linearGradient>
    <linearGradient id="shell2" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#343b43"/><stop offset="1" stop-color="#171b20"/></linearGradient>
    <pattern id="railtex" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#a3a8ad"/><path d="M0,12 L12,0" stroke="#6b737b" stroke-width="2"/></pattern>
    <style>
      .title{font:700 28px 'Microsoft YaHei',Arial,sans-serif;fill:#17202a}
      .subtitle{font:16px 'Microsoft YaHei',Arial,sans-serif;fill:#4a5662}
      .panel{fill:#fafbfd;stroke:#cbd3db;stroke-width:2}
      .label{font:16px 'Microsoft YaHei',Arial,sans-serif;fill:#202a33}
      .small{font:13px 'Microsoft YaHei',Arial,sans-serif;fill:#4a5662}
      .dim{stroke:#27313b;stroke-width:1.6;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
      .ext{stroke:#75818d;stroke-width:1;fill:none}
      .axis{stroke:#9b4a36;stroke-width:1.5;stroke-dasharray:7 5}
      .screw{fill:#c9d0d6;stroke:#58636e;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#eef1f4"/>
  <text x="55" y="55" class="title">小提琴琴弓传感器模块｜3D 草稿参考（四视图）</text>
  <text x="55" y="82" class="subtitle">概念安装：弓杆夹具 + 偏置光学 pod + 外部纹理参考条　｜　未冻结加工尺寸</text>

  <!-- panel 1 isometric -->
  <rect x="35" y="110" width="745" height="390" rx="12" class="panel"/>
  <text x="60" y="145" class="label">A  等轴测安装视图</text>
  <g transform="translate(115,230) skewY(-10)">
    <rect x="0" y="115" width="505" height="34" rx="17" fill="#765039" stroke="#3d2b20" stroke-width="3"/>
    <rect x="170" y="82" width="145" height="100" rx="12" fill="url(#shell2)" stroke="#11161a" stroke-width="3"/>
    <rect x="197" y="59" width="116" height="52" rx="10" fill="url(#shell)" stroke="#14181d" stroke-width="3"/>
    <path d="M210 112 L300 112 L323 135 L205 135 Z" fill="#1a2025" stroke="#0c1115" stroke-width="2"/>
    <rect x="278" y="52" width="135" height="83" rx="10" fill="url(#shell)" stroke="#12181d" stroke-width="3"/>
    <polygon points="278,52 413,52 444,71 310,71" fill="#68737d" opacity=".65"/>
    <rect x="320" y="128" width="48" height="10" rx="3" fill="#11161a"/>
    <path d="M413 92 C470 90 478 70 512 70" fill="none" stroke="#252b31" stroke-width="7"/>
    <path d="M413 92 C470 90 478 70 512 70" fill="none" stroke="#b6bdc4" stroke-width="2"/>
    <circle cx="206" cy="132" r="9" class="screw"/><circle cx="301" cy="132" r="9" class="screw"/>
    <line x1="0" y1="132" x2="525" y2="132" class="axis"/>
  </g>
  <text x="75" y="466" class="small">弓杆轴线 X →　灰黑色为夹壳与 pod；窗口朝下；线缆向弓根侧出线</text>
  <line x1="495" y1="230" x2="555" y2="190" class="dim"/><text x="560" y="185" class="small">pod 外壳</text>
  <line x1="375" y1="340" x2="420" y2="405" class="dim"/><text x="428" y="420" class="small">夹紧螺钉 ×2</text>

  <!-- panel 2 top -->
  <rect x="805" y="110" width="760" height="390" rx="12" class="panel"/>
  <text x="830" y="145" class="label">B  俯视图｜沿弓杆方向</text>
  <g transform="translate(865,190)">
    <rect x="50" y="130" width="600" height="34" rx="17" fill="#765039" stroke="#3d2b20" stroke-width="3"/>
    <rect x="245" y="86" width="145" height="122" rx="12" fill="url(#shell2)" stroke="#11161a" stroke-width="3"/>
    <rect x="300" y="42" width="180" height="76" rx="12" fill="url(#shell)" stroke="#11161a" stroke-width="3"/>
    <rect x="355" y="42" width="8" height="76" fill="#69737d" opacity=".45"/>
    <path d="M480 80 C535 80 550 60 597 60" fill="none" stroke="#2b3138" stroke-width="8"/>
    <path d="M480 80 C535 80 550 60 597 60" fill="none" stroke="#c0c7cd" stroke-width="2"/>
    <line x1="50" y1="147" x2="650" y2="147" class="axis"/>
    <line x1="245" y1="225" x2="390" y2="225" class="dim"/><text x="290" y="250" class="small">30 mm 初始占位</text>
    <line x1="425" y1="42" x2="425" y2="118" class="dim"/><text x="438" y="82" class="small">18 mm</text>
  </g>
  <text x="835" y="466" class="small">pod 需避开弓毛、琴弦和演奏手；实际偏置按装配姿态调整</text>

  <!-- panel 3 side -->
  <rect x="35" y="525" width="745" height="430" rx="12" class="panel"/>
  <text x="60" y="560" class="label">C  侧视图｜光学间隙和参考条</text>
  <g transform="translate(95,610)">
    <rect x="80" y="150" width="520" height="34" rx="17" fill="#765039" stroke="#3d2b20" stroke-width="3"/>
    <rect x="235" y="90" width="155" height="105" rx="12" fill="url(#shell2)" stroke="#11161a" stroke-width="3"/>
    <rect x="270" y="45" width="150" height="55" rx="10" fill="url(#shell)" stroke="#11161a" stroke-width="3"/>
    <rect x="322" y="96" width="46" height="9" rx="2" fill="#11161a"/>
    <rect x="250" y="230" width="190" height="26" rx="3" fill="url(#railtex)" stroke="#5a626a" stroke-width="2"/>
    <line x1="345" y1="105" x2="345" y2="230" class="dim"/>
    <text x="360" y="175" class="small">2.2–2.6 mm</text>
    <text x="360" y="192" class="small">资料确定的工作距离 Z</text>
    <line x1="215" y1="150" x2="215" y2="184" class="dim"/><text x="130" y="174" class="small">弓杆名义 Ø10 mm*</text>
    <line x1="250" y1="280" x2="440" y2="280" class="dim"/><text x="270" y="305" class="small">独立纹理参考条（不属于弓）</text>
    <path d="M420 72 C472 72 486 52 520 52" fill="none" stroke="#2b3138" stroke-width="8"/>
  </g>
  <text x="60" y="930" class="small">* Ø10 mm 是建模初始占位，实际弓杆常有锥度/八边形截面，必须现场测量后修改。</text>

  <!-- panel 4 exploded -->
  <rect x="805" y="525" width="760" height="430" rx="12" class="panel"/>
  <text x="830" y="560" class="label">D  爆炸图｜从上到下的装配层</text>
  <g transform="translate(900,585)">
    <rect x="100" y="20" width="260" height="58" rx="12" fill="url(#shell)" stroke="#11161a" stroke-width="3"/>
    <text x="390" y="55" class="small">pod 上壳</text>
    <line x1="355" y1="49" x2="380" y2="49" class="ext"/>
    <rect x="130" y="112" width="200" height="12" fill="#1d6b4f" stroke="#123b2d" stroke-width="2"/>
    <circle cx="160" cy="118" r="5" fill="#d0a74c"/><circle cx="298" cy="118" r="5" fill="#d0a74c"/>
    <text x="390" y="123" class="small">PCB，厚 1.60 mm*</text>
    <rect x="170" y="158" width="120" height="24" rx="3" fill="#d6b36a" stroke="#6f5422" stroke-width="2"/>
    <rect x="198" y="154" width="64" height="8" fill="#5b6065"/>
    <text x="390" y="177" class="small">镜头座 / 光学窗口</text>
    <rect x="100" y="220" width="260" height="58" rx="12" fill="url(#shell2)" stroke="#11161a" stroke-width="3"/>
    <rect x="190" y="215" width="80" height="9" rx="2" fill="#11161a"/>
    <text x="390" y="255" class="small">pod 下壳（窗口开口）</text>
    <line x1="70" y1="315" x2="390" y2="315" class="dim"/>
    <text x="145" y="343" class="small">线缆出口 + 应力释放区</text>
    <path d="M360 110 C430 110 455 88 490 88" fill="none" stroke="#2b3138" stroke-width="7"/>
    <path d="M360 110 C430 110 455 88 490 88" fill="none" stroke="#c0c7cd" stroke-width="2"/>
  </g>
  <text x="830" y="930" class="small">* PCB 厚度来自项目指南首版参考；镜头、孔位、外壳间隙必须按实物封装重建。</text>

  <rect x="55" y="970" width="1490" height="1" fill="#b9c2ca"/>
  <text x="55" y="992" class="small">状态：概念草案｜来源：docs/pmw3360_bow_pcb_guide_cn.md｜未完成实物测量、光学验证或加工公差冻结</text>
</svg>
