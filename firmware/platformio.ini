; ============================================================
; Tang Mega 60K 音乐项目 —— ESP32 手机 WiFi 工作台
; 目标板: ESP32-DevKitC V4 (38Pin / Type-C / FT232)
; 资料: 官方资料/ESP-32开发板Type-C口FT232焊针38Pin/
;
; 编译: pio run
; 烧录: pio run -t upload
; 单文件烧录包: pio run -t mergebin  ->  firmware_merged.bin (烧 0x0)
; 串口: pio device monitor
; ============================================================

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

; USB-UART 调试口（FT232）波特率
monitor_speed = 115200
upload_speed = 921600

; 曲谱存 LittleFS（默认 4MB 分区表里的 spiffs 区，约 1.4MB 可用）
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DWEBSOCKETS_MAX_DATA_SIZE=2048

lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.2.1

; 自定义目标 mergebin（tools/mergebin_target.py）
extra_scripts = tools/mergebin_target.py
